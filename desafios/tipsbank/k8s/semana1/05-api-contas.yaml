# API de Contas — Deployment + ClusterIP Service
# Namespace: tipsbank-contas (mesmo namespace do Postgres — usa short name)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-contas
  namespace: tipsbank-contas
  labels:
    app: api-contas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-contas
  template:
    metadata:
      labels:
        app: api-contas
    spec:
      # imagePullSecrets:           # Descomente se as imagens forem privadas:
      #   - name: dockerhub-credentials  # kubectl create secret docker-registry dockerhub-credentials ...
      initContainers:
        # Aguarda o Postgres aceitar conexões antes de iniciar a API
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -zw3 postgres 5432; do echo "aguardando postgres..."; sleep 3; done']
      containers:
        - name: api-contas
          image: zenardi/tipsbank-api-contas:v1.1.0
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DB_URL
            - name: LOG_LEVEL
              value: INFO
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8080
            failureThreshold: 20
            periodSeconds: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-contas
  namespace: tipsbank-contas
  labels:
    app: api-contas
spec:
  selector:
    app: api-contas
  ports:
    - name: http
      port: 8080
      targetPort: 8080
