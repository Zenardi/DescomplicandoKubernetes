# Credenciais do Postgres — compartilhadas por postgres StatefulSet e api-contas.
# Namespace: tipsbank-contas (onde o Postgres roda).
# Para api-transacoes (namespace diferente), veja 06-api-transacoes.yaml.
#
# NOTA: nome diferente dos outros namespaces (contas-db-secret vs transacoes-db-secret)
# conforme critério: Secrets/ConfigMaps com nomes distintos por namespace.
apiVersion: v1
kind: Secret
metadata:
  name: contas-db-secret
  namespace: tipsbank-contas
type: Opaque
stringData:
  POSTGRES_USER:     tipsbank
  POSTGRES_PASSWORD: tipsbank
  POSTGRES_DB:       tipsbank
  # DB_URL usada pela api-contas (postgres no mesmo namespace — short name funciona)
  DB_URL: "postgresql+psycopg://tipsbank:tipsbank@postgres:5432/tipsbank"
