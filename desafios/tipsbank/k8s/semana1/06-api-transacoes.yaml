# API de Transações — Secret de DB + Deployment + ClusterIP Service
# Namespace: tipsbank-transacoes (diferente do Postgres → usa FQDN)
---
# Secret local com a DB_URL do Postgres (namespace diferente → FQDN obrigatório)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: tipsbank-transacoes
type: Opaque
stringData:
  DB_URL: "postgresql+psycopg://tipsbank:tipsbank@postgres.tipsbank-contas.svc.cluster.local:5432/tipsbank"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-transacoes
  namespace: tipsbank-transacoes
  labels:
    app: api-transacoes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-transacoes
  template:
    metadata:
      labels:
        app: api-transacoes
    spec:
      # imagePullSecrets:
      #   - name: dockerhub-credentials
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -zw3 postgres.tipsbank-contas.svc.cluster.local 5432; do echo "aguardando postgres..."; sleep 3; done']
        - name: wait-api-contas
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -qO- http://api-contas.tipsbank-contas.svc.cluster.local:8080/health/ready; do echo "aguardando api-contas..."; sleep 3; done']
      containers:
        - name: api-transacoes
          image: zenardi/tipsbank-api-transacoes:v1.1.0
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DB_URL
            - name: CONTAS_URL
              value: "http://api-contas.tipsbank-contas.svc.cluster.local:8080"
            - name: AUDITORIA_URL
              value: "http://auditoria.tipsbank-auditoria.svc.cluster.local:8080"
            - name: APP_VERSION
              value: "v1.0.0"
            - name: LOG_LEVEL
              value: INFO
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8080
            failureThreshold: 20
            periodSeconds: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-transacoes
  namespace: tipsbank-transacoes
  labels:
    app: api-transacoes
spec:
  selector:
    app: api-transacoes
  ports:
    - name: http
      port: 8080
      targetPort: 8080
