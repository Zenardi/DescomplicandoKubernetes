# Ingress — app.tipsbank.local → web (SPA)
# Namespace: tipsbank-web
# Etapa 2.1: Exposição via Ingress Nginx
# Etapa 2.2: TLS (cert-manager) + rate-limit 50 rps
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tipsbank-app
  namespace: tipsbank-web
  annotations:
    # Rate limit: proteção contra abuso na entrada da SPA
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-req-status-code: "429"
    # TLS gerenciado pelo cert-manager (etapa 2.2)
    cert-manager.io/cluster-issuer: tipsbank-ca-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.tipsbank.local
      secretName: tipsbank-app-tls
  rules:
    - host: app.tipsbank.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
