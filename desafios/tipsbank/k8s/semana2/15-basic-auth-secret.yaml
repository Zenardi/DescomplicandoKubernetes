# Basic Auth Secret — credenciais para acesso externo à API de Contas
# Namespace: tipsbank-contas
# Etapa 2.2: Autenticação básica no Ingress api.tipsbank.local/contas
#
# Credenciais: admin / giropops
#
# Para regenerar o hash (APR1-MD5):
#   openssl passwd -apr1 -salt 'TipsBank0' 'giropops'
#   Em seguida, encode base64: echo "admin:<hash>" | base64
#
# O campo 'auth' deve conter uma linha no formato htpasswd por usuário.
---
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth-secret
  namespace: tipsbank-contas
type: Opaque
data:
  # admin:giropops  (APR1-MD5, salt=TipsBank0)
  # Regenerar: openssl passwd -apr1 -salt 'TipsBank0' 'giropops'
  auth: YWRtaW46JGFwcjEkVGlwc0JhbmskbWxzV3J6N2JJMVNpcTZuVzl4bzN0Lwo=
