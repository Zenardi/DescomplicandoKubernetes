# NetworkPolicies — tipsbank-web
# Etapa 2.5: Zero-trust networking
#
# Estratégia:
#   1. default-deny-all: bloqueia TODO tráfego de entrada e saída
#   2. Whitelist explícita:
#      - Ingress: apenas do Ingress Controller (ingress-nginx ns)
#      - Egress:  apenas DNS (CoreDNS em kube-system)
#
# O nginx do web serve a SPA + proxy reverso para as APIs via ClusterIP.
# Esse tráfego (web → api-*) passa por ClusterIP → precisamos liberar egress
# para as APIs também (veja regra allow-web-egress-apis abaixo).
---
# 1. Bloqueia TUDO por padrão
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tipsbank-web
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# 2. Permite entrada apenas do Ingress Controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-nginx-controller
  namespace: tipsbank-web
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
---
# 3. Permite saída DNS (CoreDNS)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: tipsbank-web
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# 4. Permite saída para as APIs (nginx proxy reverso: /api/* → ClusterIP das APIs)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-egress-apis
  namespace: tipsbank-web
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tipsbank-contas
          podSelector:
            matchLabels:
              app: api-contas
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tipsbank-transacoes
          podSelector:
            matchLabels:
              app: api-transacoes
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tipsbank-auditoria
          podSelector:
            matchLabels:
              app: auditoria
      ports:
        - port: 8080
          protocol: TCP
