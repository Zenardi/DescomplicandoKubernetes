# api-transacoes v2 — Canary Deployment
# Namespace: tipsbank-transacoes
# Etapa 2.4: Canary com 10% de tráfego para a v2
#
# Diferença da v2: APP_VERSION=v2.0.0 → header X-App-Version: v2.0.0 em todas as respostas
# O middleware de observabilidade em main.py já injeta esse header automaticamente.
#
# PRÉ-BUILD:
#   docker build -t zenardi/tipsbank-api-transacoes:v2.0.0 apps/api-transacoes
#   trivy image --severity HIGH,CRITICAL zenardi/tipsbank-api-transacoes:v2.0.0
#   cosign sign zenardi/tipsbank-api-transacoes:v2.0.0
#   docker push zenardi/tipsbank-api-transacoes:v2.0.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-transacoes-v2
  namespace: tipsbank-transacoes
  labels:
    app: api-transacoes-v2
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-transacoes-v2
  template:
    metadata:
      labels:
        app: api-transacoes-v2
        version: v2
    spec:
      volumes:
        - name: log-volume
          emptyDir: {}
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -zw3 postgres.tipsbank-contas.svc.cluster.local 5432; do echo "aguardando postgres..."; sleep 3; done']
        - name: wait-api-contas
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -qO- http://api-contas.tipsbank-contas.svc.cluster.local:8080/health/ready; do echo "aguardando api-contas..."; sleep 3; done']
      containers:
        - name: api-transacoes
          image: zenardi/tipsbank-api-transacoes:v2.0.0
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: transacoes-db-secret
                  key: DB_URL
            - name: CONTAS_URL
              valueFrom:
                configMapKeyRef:
                  name: transacoes-app-config
                  key: CONTAS_URL
            - name: AUDITORIA_URL
              valueFrom:
                configMapKeyRef:
                  name: transacoes-app-config
                  key: AUDITORIA_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: transacoes-app-config
                  key: LOG_LEVEL
            - name: LOG_FILE
              valueFrom:
                configMapKeyRef:
                  name: transacoes-app-config
                  key: LOG_FILE
            - name: APP_VERSION
              value: "v2.0.0"
          volumeMounts:
            - name: log-volume
              mountPath: /var/log/app
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8080
            failureThreshold: 20
            periodSeconds: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
              cpu: "200m"
        - name: log-forwarder
          image: busybox:1.36
          command: ['sh', '-c', 'until [ -f /var/log/app/app.log ]; do sleep 1; done; tail -F /var/log/app/app.log']
          volumeMounts:
            - name: log-volume
              mountPath: /var/log/app
          resources:
            requests:
              cpu: "5m"
              memory: "16Mi"
            limits:
              memory: "32Mi"
              cpu: "20m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-transacoes-v2
  namespace: tipsbank-transacoes
  labels:
    app: api-transacoes-v2
    version: v2
spec:
  selector:
    app: api-transacoes-v2
  ports:
    - name: http
      port: 8080
      targetPort: 8080
