# Ingress — api.tipsbank.local/transacoes → api-transacoes
# Namespace: tipsbank-transacoes
# Etapa 2.1: Exposição via Ingress Nginx
# Etapa 2.2: TLS herdado do host api.tipsbank.local (cert âncora em 11-ingress-contas.yaml)
#             + Session Affinity Cookie (transferências da mesma sessão → mesmo pod)
#
# Path rewriting: /transacoes/transferencias → /transferencias
#                  /transacoes/extrato/{id}   → /extrato/{id}
#                  /transacoes/health/live    → /health/live
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tipsbank-api-transacoes
  namespace: tipsbank-transacoes
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Session affinity: mesma sessão sempre roteia para o mesmo pod
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/affinity-mode: persistent
    nginx.ingress.kubernetes.io/session-cookie-name: TIPSBANK_ROUTE
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: api.tipsbank.local
      http:
        paths:
          - path: /transacoes(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-transacoes
                port:
                  number: 8080
