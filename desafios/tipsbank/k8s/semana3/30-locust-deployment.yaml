---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust
  namespace: tipsbank-monitoring
  labels:
    app: locust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust
  template:
    metadata:
      labels:
        app: locust
    spec:
      containers:
        - name: locust
          image: zenardi/tipsbank-locust:v1.0.0
          # O Dockerfile (locust/Dockerfile) copia o locustfile para /mnt/locust/,
          # mas o WORKDIR do locustio/locust:2.31.3 é /home/locust — sem args
          # o processo procura locustfile.py no diretório errado e falha.
          args:
            - "-f"
            - "/mnt/locust/locustfile.py"
          ports:
            - containerPort: 8089
              name: http
          env:
            - name: LOCUST_HOST
              value: "http://api-transacoes.tipsbank-transacoes.svc.cluster.local:8080"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8089
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: locust
  namespace: tipsbank-monitoring
  labels:
    app: locust
spec:
  selector:
    app: locust
  ports:
    - port: 8089
      targetPort: 8089
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: locust
  namespace: tipsbank-monitoring
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: tipsbank-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - locust.tipsbank.local
      secretName: locust-tls
  rules:
    - host: locust.tipsbank.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: locust
                port:
                  number: 8089