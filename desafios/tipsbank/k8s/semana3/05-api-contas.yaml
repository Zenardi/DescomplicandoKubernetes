# API de Contas — Deployment + ClusterIP Service
# Namespace: tipsbank-contas (mesmo namespace do Postgres — usa short name)
---
# ConfigMap com parâmetros não-sensíveis da api-contas
# Nome distinto dos outros namespaces: contas-app-config
apiVersion: v1
kind: ConfigMap
metadata:
  name: contas-app-config
  namespace: tipsbank-contas
data:
  LOG_LEVEL: INFO
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-contas
  namespace: tipsbank-contas
  labels:
    app: api-contas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-contas
  template:
    metadata:
      labels:
        app: api-contas
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -zw3 postgres 5432; do echo "aguardando postgres..."; sleep 3; done']
      containers:
        - name: api-contas
          image: zenardi/tipsbank-api-contas:v1.1.0
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: contas-db-secret
                  key: DB_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: contas-app-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
              cpu: "200m"
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
            failureThreshold: 6
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: api-contas
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: api-contas
  namespace: tipsbank-contas
  labels:
    app: api-contas
spec:
  selector:
    app: api-contas
  ports:
    - name: http
      port: 8080
      targetPort: 8080
