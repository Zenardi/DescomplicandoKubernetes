# API de Transações — pod multicontainer (app + sidecar log-forwarder)
# Namespace: tipsbank-transacoes
# Etapa 1.5: Secret renomeado (transacoes-db-secret ≠ contas-db-secret),
#             ConfigMap para URLs não-sensíveis, sidecar compartilhando emptyDir de log.
---
# Secret com credencial sensível (DB_URL) — nome único: transacoes-db-secret
apiVersion: v1
kind: Secret
metadata:
  name: transacoes-db-secret
  namespace: tipsbank-transacoes
type: Opaque
stringData:
  DB_URL: "postgresql+psycopg://tipsbank:tipsbank@postgres.tipsbank-contas.svc.cluster.local:5432/tipsbank"
---
# ConfigMap com parâmetros não-sensíveis — nome único: transacoes-app-config
apiVersion: v1
kind: ConfigMap
metadata:
  name: transacoes-app-config
  namespace: tipsbank-transacoes
data:
  CONTAS_URL:    "http://api-contas.tipsbank-contas.svc.cluster.local:8080"
  AUDITORIA_URL: "http://auditoria.tipsbank-auditoria.svc.cluster.local:8080"
  LOG_LEVEL:     "INFO"
  LOG_FILE:      "/var/log/app/app.log"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-transacoes
  namespace: tipsbank-transacoes
  labels:
    app: api-transacoes
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-transacoes
  template:
    metadata:
      labels:
        app: api-transacoes
    spec:
      # emptyDir compartilhado entre container principal e sidecar
      volumes:
        - name: log-volume
          emptyDir: {}
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -zw3 postgres.tipsbank-contas.svc.cluster.local 5432; do echo "aguardando postgres..."; sleep 3; done']
        - name: wait-api-contas
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -qO- http://api-contas.tipsbank-contas.svc.cluster.local:8080/health/ready; do echo "aguardando api-contas..."; sleep 3; done']
      containers:
        # ── Container principal ──────────────────────────────────────────────
        - name: api-transacoes
          image: zenardi/tipsbank-api-transacoes:v1.2.0
          ports:
            - containerPort: 8080
          env:
            # Credencial sensível — via Secret
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: transacoes-db-secret
                  key: DB_URL
            # URLs e parâmetros não-sensíveis — via ConfigMap
            - name: CONTAS_URL
              valueFrom:
                configMapKeyRef:
                  name: transacoes-app-config
                  key: CONTAS_URL
            - name: AUDITORIA_URL
              valueFrom:
                configMapKeyRef:
                  name: transacoes-app-config
                  key: AUDITORIA_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: transacoes-app-config
                  key: LOG_LEVEL
            - name: LOG_FILE
              valueFrom:
                configMapKeyRef:
                  name: transacoes-app-config
                  key: LOG_FILE
            - name: APP_VERSION
              value: "v1.2.0"
          volumeMounts:
            - name: log-volume
              mountPath: /var/log/app
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
              cpu: "200m"


        # ── Sidecar: log-forwarder ───────────────────────────────────────────
        # Lê /var/log/app/app.log (escrito pelo container principal)
        # e repassa para stdout — visível via `kubectl logs -c log-forwarder`
        - name: log-forwarder
          image: busybox:1.36
          command: ['sh', '-c', 'until [ -f /var/log/app/app.log ]; do sleep 1; done; tail -F /var/log/app/app.log']
          volumeMounts:
            - name: log-volume
              mountPath: /var/log/app
          resources:
            requests:
              cpu: "5m"
              memory: "16Mi"
            limits:
              memory: "32Mi"
              cpu: "20m"
              
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: api-transacoes
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: api-transacoes
  namespace: tipsbank-transacoes
  labels:
    app: api-transacoes
spec:
  selector:
    app: api-transacoes
  ports:
    - name: http
      port: 8080
      targetPort: 8080
