{{- if .Values.transacoes.canary.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-transacoes-v2
  namespace: tipsbank-transacoes
  labels:
    app: api-transacoes-v2
    version: v2
    team: {{ .Values.global.team }}
    env: {{ .Values.global.env }}
    {{- include "tipsbank.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-transacoes-v2
  template:
    metadata:
      labels:
        app: api-transacoes-v2
        version: v2
        team: {{ .Values.global.team }}
        env: {{ .Values.global.env }}
    spec:
      volumes:
        - name: log-volume
          emptyDir: {}
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -zw3 postgres.tipsbank-contas.svc.cluster.local 5432; do echo "aguardando postgres..."; sleep 3; done']
        - name: wait-api-contas
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -qO- http://api-contas.tipsbank-contas.svc.cluster.local:8080/health/ready; do echo "aguardando api-contas..."; sleep 3; done']
      containers:
        - name: api-transacoes
          image: {{ .Values.transacoes.api.image }}:{{ .Values.transacoes.canary.tag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: transacoes-db-secret
                  key: DB_URL
            - name: CONTAS_URL
              valueFrom:
                configMapKeyRef:
                  name: transacoes-app-config
                  key: CONTAS_URL
            - name: AUDITORIA_URL
              valueFrom:
                configMapKeyRef:
                  name: transacoes-app-config
                  key: AUDITORIA_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: transacoes-app-config
                  key: LOG_LEVEL
            - name: LOG_FILE
              valueFrom:
                configMapKeyRef:
                  name: transacoes-app-config
                  key: LOG_FILE
            - name: APP_VERSION
              value: {{ .Values.transacoes.canary.tag | quote }}
          volumeMounts:
            - name: log-volume
              mountPath: /var/log/app
          resources:
            requests:
              cpu: {{ .Values.transacoes.api.resources.requests.cpu | quote }}
              memory: {{ .Values.transacoes.api.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.transacoes.api.resources.limits.cpu | quote }}
              memory: {{ .Values.transacoes.api.resources.limits.memory | quote }}
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
        - name: log-forwarder
          image: busybox:1.36
          command: ['sh', '-c', 'until [ -f /var/log/app/app.log ]; do sleep 1; done; tail -F /var/log/app/app.log']
          volumeMounts:
            - name: log-volume
              mountPath: /var/log/app
          resources:
            requests:
              cpu: "5m"
              memory: "16Mi"
            limits:
              cpu: "20m"
              memory: "32Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-transacoes-v2
  namespace: tipsbank-transacoes
  labels:
    app: api-transacoes-v2
    version: v2
    {{- include "tipsbank.labels" . | nindent 4 }}
spec:
  selector:
    app: api-transacoes-v2
  ports:
    - name: http
      port: 8080
      targetPort: 8080
{{- end }}
