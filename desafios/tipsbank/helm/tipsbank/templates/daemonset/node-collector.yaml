{{- if .Values.daemonset.nodeCollector.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-collector
  namespace: tipsbank-monitoring
  labels:
    app: node-collector
    team: {{ .Values.global.team }}
    env: {{ .Values.global.env }}
    {{- include "tipsbank.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: node-collector
  template:
    metadata:
      labels:
        app: node-collector
        team: {{ .Values.global.team }}
        env: {{ .Values.global.env }}
    spec:
      tolerations:
        - key: "compliance"
          operator: "Equal"
          value: "strict"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: collector
          image: busybox:1.36
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
          command:
            - sh
            - -c
            - |
              while true; do
                echo "=== $(date) | node=$(hostname) ==="
                df -h / | tail -1
                free -m | grep Mem
                echo "uptime: $(cat /proc/uptime)"
                sleep 30
              done
          resources:
            requests:
              cpu: "5m"
              memory: "16Mi"
            limits:
              cpu: "20m"
              memory: "32Mi"
          volumeMounts:
            - name: host-root
              mountPath: /host-root
              readOnly: true
      volumes:
        - name: host-root
          hostPath:
            path: /
      terminationGracePeriodSeconds: 10
{{- end }}
