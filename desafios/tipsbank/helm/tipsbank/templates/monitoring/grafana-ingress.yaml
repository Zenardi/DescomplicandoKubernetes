{{- if .Values.monitoring.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: tipsbank-monitoring
  labels:
    {{- include "tipsbank.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: {{ .Values.global.clusterIssuer }}
spec:
  ingressClassName: {{ .Values.global.ingressClass }}
  tls:
    - hosts:
        - {{ .Values.monitoring.ingress.grafanaHost }}
      secretName: grafana-tls
  rules:
    - host: {{ .Values.monitoring.ingress.grafanaHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: tipsbank-monitoring
  labels:
    {{- include "tipsbank.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: {{ .Values.global.clusterIssuer }}
spec:
  ingressClassName: {{ .Values.global.ingressClass }}
  tls:
    - hosts:
        - {{ .Values.monitoring.ingress.prometheusHost }}
      secretName: prometheus-tls
  rules:
    - host: {{ .Values.monitoring.ingress.prometheusHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-prometheus
                port:
                  number: 9090
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager
  namespace: tipsbank-monitoring
  labels:
    {{- include "tipsbank.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: {{ .Values.global.clusterIssuer }}
spec:
  ingressClassName: {{ .Values.global.ingressClass }}
  tls:
    - hosts:
        - {{ .Values.monitoring.ingress.alertmanagerHost }}
      secretName: alertmanager-tls
  rules:
    - host: {{ .Values.monitoring.ingress.alertmanagerHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-alertmanager
                port:
                  number: 9093
{{- end }}
