apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-contas
  namespace: tipsbank-contas
  labels:
    app: api-contas
    team: {{ .Values.global.team }}
    env: {{ .Values.global.env }}
    {{- include "tipsbank.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.contas.api.replicas }}
  selector:
    matchLabels:
      app: api-contas
  template:
    metadata:
      labels:
        app: api-contas
        team: {{ .Values.global.team }}
        env: {{ .Values.global.env }}
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -zw3 postgres 5432; do echo "aguardando postgres..."; sleep 3; done']
      containers:
        - name: api-contas
          image: {{ .Values.contas.api.image }}:{{ .Values.contas.api.tag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: contas-db-secret
                  key: DB_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: contas-app-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: {{ .Values.contas.api.resources.requests.cpu | quote }}
              memory: {{ .Values.contas.api.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.contas.api.resources.limits.cpu | quote }}
              memory: {{ .Values.contas.api.resources.limits.memory | quote }}
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
            failureThreshold: 6
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: api-contas
                topologyKey: kubernetes.io/hostname
