apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gpu-affinity
spec:
  selector:
    matchLabels:
      app: nginx-gpu-affinity
  template:
    metadata:
      labels:
        app: nginx-gpu-affinity
    spec:
      containers:
      - name: nginx-gpu-affinity
        image: nginx
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "64Mi"
            cpu: "250m"
        ports:
        - containerPort: 80
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: "gpu"
              operator: In
              values:
              - "true"
